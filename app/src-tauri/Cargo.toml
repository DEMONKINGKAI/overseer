[package]
name = "overseer"
version = "0.1.0"
description = "Your agents have an Overseer now."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde_json = "1"
tiny_http = "0.12"
dirs = "5"

[profile.release]
strip = true
lto = true
opt-level = "s"
